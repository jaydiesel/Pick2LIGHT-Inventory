# Pick2LIGHT-Inventory — Docker Compose stack.
# Copy .env.example to .env, set P2L_DB_PASSWORD, then: docker compose up -d

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: p2l
      POSTGRES_DB: pick2light
      POSTGRES_PASSWORD: ${P2L_DB_PASSWORD:?Set P2L_DB_PASSWORD in .env}
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      # Only reachable from this machine; the server runs with host networking.
      - "127.0.0.1:${P2L_DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U p2l -d pick2light"]
      interval: 5s
      timeout: 5s
      retries: 20

  server:
    image: ghcr.io/jaydiesel/pick2light-inventory:${P2L_VERSION:-latest}
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
    restart: unless-stopped
    # Host networking so controllers and browsers on the LAN reach it directly (and mDNS works in v0.2).
    network_mode: host
    environment: &server-env
      P2L_DATABASE_URL: postgresql+asyncpg://p2l:${P2L_DB_PASSWORD}@127.0.0.1:${P2L_DB_PORT:-5432}/pick2light
      P2L_PORT: ${P2L_HTTP_PORT:-80}
      TZ: ${TZ:-Etc/UTC}
    volumes: &server-volumes
      - ${P2L_DATA_DIR:-./data}:/data
      - ${P2L_BACKUP_DIR:-./backups}:/backups
    depends_on:
      db:
        condition: service_healthy

  backup:
    image: ghcr.io/jaydiesel/pick2light-inventory:${P2L_VERSION:-latest}
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
    restart: unless-stopped
    command: ["backup-scheduler"]
    network_mode: host
    environment: *server-env
    volumes: *server-volumes
    healthcheck:
      disable: true
    depends_on:
      server:
        condition: service_started

volumes:
  db-data:
