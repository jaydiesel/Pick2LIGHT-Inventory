[project]
name = "pick2light"
version = "0.1.0"
description = "Pick2LIGHT-Inventory server"
requires-python = ">=3.12"
license = { text = "GPL-3.0-only" }
dependencies = [
    "alembic==1.20.1",
    "argon2-cffi==25.1.0",
    "asyncpg==0.32.0",
    "fastapi==0.162.0",
    "img2pdf==0.6.3",
    "itsdangerous==2.2.0",
    "pillow==13.0.0",
    "pydantic-settings==2.16.2",
    "pylibdmtx==0.1.10",
    "python-barcode==0.16.1",
    "python-multipart==0.0.33",
    "segno==1.6.6",
    "setuptools==84.2.1",
    "sqlalchemy[asyncio]==2.1.6",
    "typer==0.27.3",
    "uvicorn[standard]==0.54.0",
]

[project.scripts]
pick2light = "pick2light.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pick2light"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
filterwarnings = [
    # pylibdmtx 0.1.10 (unmaintained) uses distutils.version.LooseVersion on import.
    "ignore:distutils Version classes are deprecated:DeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["pick2light/migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[dependency-groups]
dev = [
    "httpx==0.28.1",
    "mypy==2.4.1",
    "pytest==9.2.0",
    "pytest-asyncio==1.4.1.post1",
    "ruff==0.17.3",
]

[[tool.mypy.overrides]]
module = ["pylibdmtx.*", "barcode.*", "img2pdf.*"]
ignore_missing_imports = true
